name: Backend Tests

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: attendance_test
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attendance -d attendance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ATTENDANCE_DATABASE_URL: postgresql+asyncpg://attendance:testpassword@localhost:5432/attendance_test
      ATTENDANCE_DATABASE_URL_TEST: postgresql+asyncpg://attendance:testpassword@localhost:5432/attendance_test
      ATTENDANCE_REDIS_URL: redis://localhost:6379/0
      ATTENDANCE_REDIS_URL_TEST: redis://localhost:6379/0
      ATTENDANCE_JWT_SECRET: ci-test-secret-not-for-production-use-only
      ATTENDANCE_ALLOWED_ORIGINS: http://localhost:5173
      ATTENDANCE_TRITON_URL: fake-host:8001
      ATTENDANCE_TRITON_YOLO_MODEL_NAME: yolov12
      ATTENDANCE_TRITON_YOLO_INPUT_NAME: INPUT__0
      ATTENDANCE_TRITON_YOLO_OUTPUT_NAME: OUTPUT__0
      ATTENDANCE_TRITON_LVFACE_MODEL_NAME: lvface
      ATTENDANCE_TRITON_LVFACE_INPUT_NAME: INPUT__0
      ATTENDANCE_TRITON_LVFACE_LIVENESS_OUTPUT_NAME: LIVENESS__0
      ATTENDANCE_TRITON_LVFACE_EMBEDDING_OUTPUT_NAME: EMBEDDING__1
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      # -c constraints.txt pins the whole resolved set. Without it pip picks the
      # newest-compatible release of every floating range on each run, so an
      # upstream release that adds a new warning becomes a hard failure under
      # filterwarnings=error with no change on our side. See constraints.txt.
      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run pytest smoke suite
        run: >-
          pytest -v --tb=short
          -m "not slow"
          --cov=backend/app
          --cov-report=xml
          --cov-report=term
          --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  migration-round-trip:
    name: Alembic migration round-trip
    runs-on: ubuntu-latest

    # Deliberately its own job with its own postgres service, rather than
    # extra steps bolted onto `smoke`:
    #   - `alembic downgrade base` is destructive (see ATT-078 / #83 for a
    #     concrete example: migration 20260503_0003's downgrade runs
    #     `DELETE FROM sightings WHERE student_id IS NULL`). It must never
    #     run against the database the smoke suite depends on.
    #   - A separate job gets its own service container for free and runs
    #     in parallel with `smoke`, so it costs wall-clock, not serial time.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: attendance_test
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attendance -d attendance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ATTENDANCE_DATABASE_URL: postgresql+asyncpg://attendance:testpassword@localhost:5432/attendance_test
      PYTHONUNBUFFERED: "1"
      # libpq env vars consumed by scripts/verify_migration_schema_state.py
      # (psycopg2.connect() with no args reads these directly).
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: attendance
      PGPASSWORD: testpassword
      PGDATABASE: attendance_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt

      - name: alembic upgrade head
        working-directory: backend
        run: alembic upgrade head

      - name: Assert head revision reached
        working-directory: backend
        run: |
          head_rev="$(alembic heads | awk '{print $1}' | head -n 1)"
          current="$(alembic current)"
          echo "alembic heads -> ${head_rev}"
          echo "alembic current -> ${current}"
          echo "${current}" | grep -q "${head_rev}" || {
            echo "FAIL: expected revision ${head_rev} after 'alembic upgrade head', got: ${current}" >&2
            exit 1
          }
          echo "${current}" | grep -q "(head)" || {
            echo "FAIL: 'alembic current' did not report (head) after 'alembic upgrade head', got: ${current}" >&2
            exit 1
          }

      - name: Assert domain tables exist after upgrade
        run: python scripts/verify_migration_schema_state.py populated

      - name: alembic downgrade base
        working-directory: backend
        run: alembic downgrade base

      - name: Assert base state reached (no current revision)
        working-directory: backend
        run: |
          current="$(alembic current)"
          if [ -n "${current}" ]; then
            echo "FAIL: expected no current revision after 'alembic downgrade base', got: ${current}" >&2
            exit 1
          fi
          echo "OK: no current revision after 'alembic downgrade base'."

      - name: Assert schema is actually empty after downgrade base
        run: python scripts/verify_migration_schema_state.py empty

      - name: alembic upgrade head (re-upgrade)
        working-directory: backend
        run: alembic upgrade head

      - name: Assert head revision reached again
        working-directory: backend
        run: |
          current="$(alembic current)"
          echo "alembic current -> ${current}"
          echo "${current}" | grep -q "${head_rev}" || {
            echo "FAIL: expected revision ${head_rev} after re-running 'alembic upgrade head', got: ${current}" >&2
            exit 1
          }
          echo "${current}" | grep -q "(head)" || {
            echo "FAIL: 'alembic current' did not report (head) after re-running 'alembic upgrade head', got: ${current}" >&2
            exit 1
          }

      - name: Assert domain tables exist after re-upgrade
        run: python scripts/verify_migration_schema_state.py populated
