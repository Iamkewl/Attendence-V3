[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-v2-backend"
version = "0.1.0"
description = "Phase 2 security-hardened backend shell for the V2 Attendance System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "sqlalchemy>=2.0.41,<3.0.0",
    "alembic>=1.16.1,<2.0.0",
    "pydantic>=2.11.4,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "celery>=5.4.0,<6.0.0",
    "numpy>=2.1.0,<3.0.0",
    "passlib[argon2]>=1.7.4,<2.0.0",
    "pgvector>=0.3.5,<1.0.0",
    "pillow>=10.4.0,<12.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "redis>=5.0.4,<6.0.0",
    "tritonclient[grpc]>=2.56.0,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "uvicorn[standard]>=0.30.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-asyncio>=0.26.0,<1.0.0",
    "pytest-cov>=6.1.1,<7.0.0",
    "ruff>=0.11.10,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
]
